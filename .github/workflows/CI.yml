name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  appimage-and-tests:
    name: "Build AppImage & Run Tests (x86_64)"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build valac gcc pkg-config gettext xvfb \
            libgtk-4-dev libgee-0.8-dev \
            libjson-glib-dev libportal-dev libportal-gtk4-dev \
            desktop-file-utils libglib2.0-bin appstream \
            file wget curl zsync

      - name: Compile and Run Unit Tests
        run: |
          meson setup builddir --prefix=/usr --buildtype=debug -Dprofile=linux
          meson compile -C builddir
          GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a meson test -C builddir --verbose

      - name: Verify AppImage Assembly
        run: |
          ./packaging/appimage/build-appimage.sh

  flatpak:
    name: Flatpak (${{ matrix.configuration.arch }})
    runs-on: ${{ matrix.configuration.runs-on }}

    strategy:
      matrix:
        configuration:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak & Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak & Run Tests
        run: |
          flatpak-builder --user --force-clean --repo=repo --install-deps-from=flathub builddir io.github.comicdeed.jots.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest

    container:
      image: valalang/lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: io.elementary.vala-lint src tests

