# On new app releases or release/* PR merge to main
# Build multi-arch AppImages, Flatpak bundles, and publish GitHub Release
name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. 1.1.0 or 1.1.0-beta.1)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  init-release:
    name: "Initialize Release & Resolve Tag"
    # Run if: manual dispatch, pushed tag, or merged PR from a release/* branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
      is_prerelease: ${{ steps.resolve_tag.outputs.is_prerelease }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 'Resolve Version and Create Git Tag if Merged'
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # Extract version from latest release entry in AppStream metadata
            TAG=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('data/jots.metainfo.xml.in.in')
          root = tree.getroot()
          latest = root.find('.//releases/release')
          print(latest.get('version', '') if latest is not None else '')
          ")
          fi

          if [ -z "$TAG" ]; then
            echo "Error: Could not determine release tag name."
            exit 1
          fi

          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          
          # Check if tag is prerelease
          if [[ "$TAG" =~ (beta|alpha|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # If triggered by PR merge to main, tag the merge commit
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tagging commit with $TAG..."
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
          fi

  build-linux-appimage:
    name: "Build AppImage (${{ matrix.arch }})"
    needs: [init-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build valac gcc pkg-config gettext \
            libgtk-4-dev libgee-0.8-dev \
            libjson-glib-dev libportal-dev libportal-gtk4-dev \
            librsvg2-dev librsvg2-common \
            desktop-file-utils libglib2.0-bin appstream \
            file wget curl zsync

      - name: 'Build AppImage'
        run: |
          export ARCH="${{ matrix.arch }}"
          export VERSION="${{ needs.init-release.outputs.tag_name }}"
          ./packaging/appimage/build-appimage.sh

      - name: 'Upload AppImage Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: Jots-${{ matrix.arch }}-AppImage
          path: dist/*
          retention-days: 2

  build-flatpak-bundle:
    name: "Build Flatpak Bundle (x86_64)"
    needs: [init-release]
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v5
        with:
          lfs: 'true'

      - name: 'Install Flatpak & Builder'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: 'Build and Export Flatpak Bundle'
        run: |
          VERSION="${{ needs.init-release.outputs.tag_name }}"
          flatpak-builder --user --force-clean --repo=repo --install-deps-from=flathub builddir io.github.comicdeed.jots.yml
          mkdir -p dist
          flatpak build-bundle repo "dist/io.github.comicdeed.jots-${VERSION}.flatpak" io.github.comicdeed.jots
          cd dist && sha256sum "io.github.comicdeed.jots-${VERSION}.flatpak" > "io.github.comicdeed.jots-${VERSION}.flatpak.sha256"

      - name: 'Upload Flatpak Bundle Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: io.github.comicdeed.jots-Flatpak
          path: dist/*
          retention-days: 2

  github-release:
    name: "Publish Consolidated GitHub Release"
    needs: [init-release, build-linux-appimage, build-flatpak-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v5

      - name: 'Download all artifacts'
        uses: actions/download-artifact@v4
        with:
          path: ./dist-artifacts

      - name: 'Consolidate release distribution assets'
        run: |
          mkdir -p ./release-dist
          find ./dist-artifacts -type f -exec cp {} ./release-dist/ \;
          cd ./release-dist
          sha256sum * | grep -v '\.sha256$' | grep -v 'SHA256SUMS' > SHA256SUMS.txt || true

      - name: 'Extract Release Notes from Metainfo'
        id: extract_notes
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('data/jots.metainfo.xml.in.in')
          root = tree.getroot()
          latest = root.find('.//releases/release')
          notes = []
          if latest is not None:
              desc = latest.find('description')
              if desc is not None:
                  for elem in desc:
                      if elem.tag == 'p' and elem.text:
                          notes.append(elem.text.strip() + '\n')
                      elif elem.tag == 'ul':
                          for li in elem.findall('li'):
                              if li.text:
                                  notes.append(f'* {li.text.strip()}')
          content = '\n'.join(notes).strip()
          with open('release_notes.md', 'w') as f:
              f.write(content + '\n' if content else '')
          "

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.init-release.outputs.tag_name }}
          name: "Jots ${{ needs.init-release.outputs.tag_name }}"
          body_path: release_notes.md
          generate_release_notes: true
          prerelease: ${{ needs.init-release.outputs.is_prerelease == 'true' }}
          files: ./release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-develop:
    name: "Sync Release back to Develop"
    needs: [github-release]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout develop'
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: 'Merge main into develop'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git merge -X theirs --no-edit main
          git push origin develop
