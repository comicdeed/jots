# On new app releases
# Generate a windows installer and publish a GitHub Release
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-appimage:
    name: "Build AppImage (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            use_qemu: false
          - arch: aarch64
            runner: ubuntu-24.04
            use_qemu: true

    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Set up QEMU (for aarch64)'
        if: matrix.use_qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build valac gcc pkg-config \
            libgtk-4-dev libgranite-7-dev libgee-0.8-dev \
            libjson-glib-dev libportal-dev libportal-gtk4-dev \
            desktop-file-utils libglib2.0-bin appstream \
            file wget curl zsync

      - name: 'Compile Once into DESTDIR staging'
        run: |
          meson setup builddir \
            --prefix=/usr \
            --buildtype=release \
            --strip \
            -Dprofile=default \
            -Ddevelopment=false \
            -Dicon_variant=default
          meson compile -C builddir
          DESTDIR="$(pwd)/stage" meson install -C builddir
          glib-compile-schemas stage/usr/share/glib-2.0/schemas

      - name: 'Build AppImage via linuxdeploy'
        run: |
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          
          # Prepare AppDir
          cp -r stage AppDir
          cp packaging/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          # Fetch linuxdeploy and GTK plugin
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh"
          chmod +x "linuxdeploy-${ARCH}.AppImage" linuxdeploy-plugin-gtk.sh

          # Package AppImage
          export OUTPUT="dist/Jots-${ARCH}.AppImage"
          ./linuxdeploy-${ARCH}.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.comicdeed.jots.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/io.github.comicdeed.jots.svg \
            --plugin gtk \
            --output appimage

          cd dist && sha256sum "Jots-${ARCH}.AppImage" > "Jots-${ARCH}.AppImage.sha256"

      - name: 'Upload AppImage Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: Jots-${{ matrix.arch }}-AppImage
          path: dist/*

  build-flatpak-bundle:
    name: "Build Flatpak Bundle (x86_64)"
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Install Flatpak & Builder'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: 'Build and Export Flatpak Bundle'
        run: |
          flatpak-builder --force-clean --repo=repo --install-deps-from=flathub builddir io.github.comicdeed.jots.yml
          mkdir -p dist
          flatpak build-bundle repo dist/io.github.comicdeed.jots.flatpak io.github.comicdeed.jots
          cd dist && sha256sum io.github.comicdeed.jots.flatpak > io.github.comicdeed.jots.flatpak.sha256

      - name: 'Upload Flatpak Bundle Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: io.github.comicdeed.jots-Flatpak
          path: dist/*

  msys2:
    name: "Prepare Windows Installer"
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: windows-latest
            sys: mingw64
            package: x86_64
      fail-fast: false
    runs-on: ${{ matrix.variant.runner }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: 'Checkout latest sources'
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: 'Prepare MSYS2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.variant.sys }}
          update: true
          install: |
            git make zip unzip
            mingw-w64-${{ matrix.variant.package }}-meson mingw-w64-${{ matrix.variant.package }}-gcc mingw-w64-${{ matrix.variant.package }}-vala mingw-w64-${{ matrix.variant.package }}-desktop-file-utils
            mingw-w64-${{ matrix.variant.package }}-gsettings-desktop-schemas mingw-w64-${{ matrix.variant.package }}-granite7 mingw-w64-${{ matrix.variant.package }}-gtk-elementary-theme mingw-w64-${{ matrix.variant.package }}-elementary-icon-theme mingw-w64-${{ matrix.variant.package }}-libgee mingw-w64-${{ matrix.variant.package }}-json-glib
            mingw-w64-${{ matrix.variant.package }}-nsis mingw-w64-${{ matrix.variant.package }}-adwaita-icon-theme

      - name: 'Setup build directory'
        run: |
          meson setup builddir -Dprofile='windows' --buildtype=release
          meson compile -C builddir
          
      - name: 'Setup for deployment'
        run: builddir/windows/deploy.sh builddir

      - name: 'Create windows installer'
        id: build_installer
        run: |
          cp builddir/windows/installer.nsi .
          makensis installer.nsi

      - name: 'Upload Installer Artifact'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jots-Installer.exe
          path: Jots-Installer.exe
          if-no-files-found: ignore

  github-release:
    name: "Publish Consolidated GitHub Release"
    needs: [build-linux-appimage, build-flatpak-bundle, msys2]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout sources'
        uses: actions/checkout@v4

      - name: 'Download all artifacts'
        uses: actions/download-artifact@v4
        with:
          path: ./dist-artifacts

      - name: 'Consolidate release distribution assets'
        run: |
          mkdir -p ./release-dist
          find ./dist-artifacts -type f -exec cp {} ./release-dist/ \;
          cd ./release-dist
          sha256sum * | grep -v '\.sha256$' | grep -v 'SHA256SUMS' > SHA256SUMS.txt || true

      - name: 'Extract Release Notes from Metainfo'
        id: extract_notes
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('data/jots.metainfo.xml.in.in')
          root = tree.getroot()
          latest = root.find('.//releases/release')
          notes = []
          if latest is not None:
              desc = latest.find('description')
              if desc is not None:
                  for elem in desc:
                      if elem.tag == 'p' and elem.text:
                          notes.append(elem.text.strip() + '\n')
                      elif elem.tag == 'ul':
                          for li in elem.findall('li'):
                              if li.text:
                                  notes.append(f'* {li.text.strip()}')
          content = '\n'.join(notes).strip()
          with open('release_notes.md', 'w') as f:
              f.write(content + '\n' if content else '')
          "

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          files: ./release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
