<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="768" viewBox="0 0 2048 768" role="img" aria-labelledby="title desc">
  <title id="title">Download AppImage Badge</title>
  <desc id="desc">A rounded black download badge with AppImage icon and the text Download AppImage.</desc>

  <defs>
    <linearGradient id="appBlueTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FA8EE"/>
      <stop offset="100%" stop-color="#2D84D0"/>
    </linearGradient>
    <linearGradient id="appBlueBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2456B1"/>
      <stop offset="100%" stop-color="#1B489F"/>
    </linearGradient>
    <linearGradient id="foldFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DBF0FF"/>
      <stop offset="100%" stop-color="#91CFF8"/>
    </linearGradient>
    <linearGradient id="foldUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B7DEFA"/>
      <stop offset="100%" stop-color="#83BDE8"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EEF8"/>
    </linearGradient>
    <clipPath id="panelClip">
      <path d="M124 36 H458 L556 134 V644 A88 88 0 0 1 468 732 H124 A88 88 0 0 1 36 644 V124 A88 88 0 0 1 124 36 Z"/>
    </clipPath>
  </defs>

  <!-- Outer badge -->
  <rect x="14" y="14" width="2020" height="740" rx="108" ry="108" fill="#000000" stroke="#FFFFFF" stroke-width="12"/>

  <g transform="translate(29.6 38.4) scale(0.9)">
    <!-- Left AppImage panel -->
    <path d="M124 36 H458 L556 134 V644 A88 88 0 0 1 468 732 H124 A88 88 0 0 1 36 644 V124 A88 88 0 0 1 124 36 Z" fill="url(#appBlueTop)"/>
    <g clip-path="url(#panelClip)">
      <rect x="36" y="610" width="520" height="122" fill="url(#appBlueBottom)"/>
    </g>
    <g clip-path="url(#panelClip)">
      <path d="M458 36 L556 134 L556 36 Z" fill="url(#foldFace)"/>
      <path d="M458 36 L522 100 L556 134 L500 134 Q458 134 458 92 Z" fill="url(#foldUnder)" opacity="0.9"/>
      <line x1="458" y1="36" x2="556" y2="134" stroke="#EAF8FF" stroke-width="1.5" opacity="0.35"/>
    </g>

    <!-- Arrow -->
    <g fill="#FFFFFF">
      <rect x="254" y="110" width="84" height="170" rx="9" ry="9"/>
      <path d="M187 215 H405 L296 336 Z"/>
    </g>

    <!-- Gear -->
    <g transform="translate(296 454)">
      <g fill="#FFFFFF">
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(45)"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(90)"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(135)"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(180)"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(225)"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(270)"/>
        <rect x="-16" y="-120" width="32" height="40" rx="8" ry="8" transform="rotate(315)"/>
        <circle r="84"/>
      </g>
      <circle r="43" fill="#4F9CD9"/>
    </g>

    <!-- AppImage text on panel -->
    <text x="296" y="686" text-anchor="middle" fill="#FFFFFF" font-size="74" font-weight="700" font-family="Cantarell, Noto Sans, DejaVu Sans, Arial, sans-serif">AppImage</text>
  </g>

  <!-- Right-side badge text -->
  <text x="704" y="328" fill="#FFFFFF" font-size="132" font-weight="500" letter-spacing="0.2" font-family="Cantarell, Noto Sans, DejaVu Sans, Arial, sans-serif">Download</text>
  <text x="704" y="564" fill="#FFFFFF" font-size="224" font-weight="700" letter-spacing="0" font-family="Cantarell, Noto Sans, DejaVu Sans, Arial, sans-serif">AppImage</text>
</svg>
