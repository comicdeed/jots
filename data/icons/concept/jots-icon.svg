<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft elementary / GNOME style drop shadows -->
    <filter id="note-shadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#141005" flood-opacity="0.16" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#141005" flood-opacity="0.09" />
    </filter>

    <!-- Dog-ear fold realistic shadow casting onto the paper below -->
    <filter id="dogear-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="10" stdDeviation="8" flood-color="#3A2800" flood-opacity="0.22" />
      <feDropShadow dx="-2" dy="3" stdDeviation="3" flood-color="#3A2800" flood-opacity="0.12" />
    </filter>

    <!-- Main sticky note vibrant warm yellow gradient -->
    <linearGradient id="note-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDD53" />
      <stop offset="40%" stop-color="#FCD232" />
      <stop offset="100%" stop-color="#F5BD19" />
    </linearGradient>

    <!-- Dog-ear underside paper gradient -->
    <linearGradient id="dogear-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="45%" stop-color="#FEEA85" />
      <stop offset="85%" stop-color="#F9D74C" />
      <stop offset="100%" stop-color="#E5BE30" />
    </linearGradient>

    <!-- Clip path to contain straight hatch lines inside natural J body -->
    <clipPath id="j-natural-clip">
      <path d="
        M 175 142
        C 210 134 260 126 325 120
        C 334 119 340 126 336 135
        C 330 148 314 156 295 158
        C 292 195 285 260 270 318
        C 255 372 225 398 178 398
        C 134 398 112 362 114 322
        C 116 288 140 270 162 272
        C 180 274 188 290 184 308
        C 178 334 162 346 154 348
        C 160 360 172 368 192 366
        C 220 362 242 334 250 285
        C 260 225 264 170 265 146
        C 230 152 194 162 174 170
        C 165 174 158 164 164 154
        C 167 148 171 144 175 142
        Z" />
    </clipPath>
  </defs>

  <!-- Sticky Note 5x5 cm Pad Body (Canvas: 40 to 472) -->
  <g filter="url(#note-shadow)">
    <path d="
      M 112 40
      L 352 40
      Q 360 40 366 46
      L 466 146
      Q 472 152 472 160
      L 472 400
      C 472 440 440 472 400 472
      L 112 472
      C 72 472 40 440 40 400
      L 40 112
      C 40 72 72 40 112 40
      Z"
      fill="url(#note-body-grad)" />
  </g>

  <!-- Folded Dog-Ear Corner -->
  <path d="
    M 352 40
    C 352 95 365 160 472 160
    L 366 46
    Z"
    fill="url(#dogear-grad)"
    filter="url(#dogear-shadow)" />

  <!-- ======================================================== -->
  <!-- Classic Biro Blue Handwritten J with Straight Hatches -->
  <!-- ======================================================== -->
  <!-- Solid Crisp J Glyph -->
  <path d="M 175 142 C 210 134 260 126 325 120 C 334 119 340 126 336 135 C 330 148 314 156 295 158 C 292 195 285 260 270 318 C 255 372 225 398 178 398 C 134 398 112 362 114 322 C 116 288 140 270 162 272 C 180 274 188 290 184 308 C 178 334 162 346 154 348 C 160 360 172 368 192 366 C 220 362 242 334 250 285 C 260 225 264 170 265 146 C 230 152 194 162 174 170 C 165 174 158 164 164 154 C 167 148 171 144 175 142 Z" fill="#0E3D9E" />


  <!-- 2. Primary Hand-Drawn Biro Outline (stroke-width: 6.5) -->
  <path d="
    M 175 142
    C 210 134 260 126 325 120
    C 334 119 340 126 336 135
    C 330 148 314 156 295 158
    C 292 195 285 260 270 318
    C 255 372 225 398 178 398
    C 134 398 112 362 114 322
    C 116 288 140 270 162 272
    C 180 274 188 290 184 308
    C 178 334 162 346 154 348
    C 160 360 172 368 192 366
    C 220 362 242 334 250 285
    C 260 225 264 170 265 146
    C 230 152 194 162 174 170
    C 165 174 158 164 164 154
    C 167 148 171 144 175 142
    Z"
    fill="none"
    stroke="#0B3082"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- 3. Organic Pen Over-Trace Accent Line -->
  <path d="
    M 178 143
    C 214 135 262 127 322 121
    M 293 160
    C 290 198 283 262 268 320
    C 253 374 223 396 178 396
    C 136 396 115 360 116 322
    C 118 290 140 272 160 274
    M 222 360
    C 244 330 252 282 262 220
    C 265 168 266 148 265 148
    C 232 153 196 163 176 171"
    fill="none"
    stroke="#072260"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75" />

  <!-- ======================================================== -->
  <!-- Two Casual Hand-Drawn Biro Underline Strokes -->
  <!-- ======================================================== -->

  <!-- Top Underline Stroke (stroke-width: 6.5, matching outline) -->
  <path d="
    M 230 418
    C 268 409 314 402 362 398"
    fill="none"
    stroke="#0B3082"
    stroke-width="6.5"
    stroke-linecap="round" />

  <!-- Top Underline Over-Trace Accent -->
  <path d="
    M 233 419
    C 270 410 316 403 358 399"
    fill="none"
    stroke="#072260"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.75" />

  <!-- Bottom Underline Stroke (stroke-width: 6.5, matching outline) -->
  <path d="
    M 238 440
    C 276 433 322 426 372 422"
    fill="none"
    stroke="#0B3082"
    stroke-width="6.5"
    stroke-linecap="round" />

  <!-- Bottom Underline Over-Trace Accent -->
  <path d="
    M 241 441
    C 278 434 324 427 368 423"
    fill="none"
    stroke="#072260"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.75" />
</svg>
