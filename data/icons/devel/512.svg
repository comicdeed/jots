      <stop offset="40%" stop-color="#FEECA8" />
      <stop offset="100%" stop-color="#F9DF88" />
    </linearGradient>
    <linearGradient id="fold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FFF8DE" />
      <stop offset="100%" stop-color="#F2D372" />
    </linearGradient>
    <clipPath id="note-outline-clip">
