<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes Palette Matrix</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    
    <style>
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        
        .handlee-font {
            font-family: 'Handlee', cursive;
        }

        .sticky-note {
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.5s ease, color 0.5s ease;
            position: relative;
        }
        
        .sticky-note:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }
        
        .sticky-note::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: linear-gradient(to top left, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.0) 50%);
            border-bottom-right-radius: 0.5rem;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .dark .sticky-note::after {
            background: linear-gradient(to top left, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.0) 50%);
        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-6 md:p-12" id="body">
    
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center mb-10 gap-6">
        <div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-2 handlee-font">Sticky Note Palettes</h1>
            <p class="text-slate-500 max-w-lg" id="subtitle">Explore 12 vibrant themes optimized for legibility and visual comfort.</p>
        </div>
        
        <div class="flex items-center gap-4 bg-white px-6 py-3 rounded-full shadow-sm border border-slate-200" id="toggle-container">
            <span class="text-sm font-medium text-slate-600" id="light-label">Light</span>
            <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" name="toggle" id="mode-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10 transition-transform duration-300 ease-in-out transform translate-x-0"/>
                <label for="mode-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer transition-colors duration-300 ease-in-out"></label>
            </div>
            <span class="text-sm font-medium text-slate-400" id="dark-label">Dark</span>
        </div>
    </div>

    <div id="matrix-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6 max-w-6xl mx-auto mb-16">
        <!-- Sticky notes will be injected here via JavaScript -->
    </div>

    <div class="max-w-6xl mx-auto border-t border-slate-300 dark:border-slate-700 pt-10 pb-20">
        <h2 class="text-xl font-bold mb-6 text-center text-slate-500 dark:text-slate-400">Picker UI Simulation</h2>
        <div id="picker-row" class="flex flex-wrap justify-center gap-3 md:gap-4 p-6 bg-slate-200 dark:bg-slate-800 rounded-2xl shadow-inner max-w-max mx-auto">
            <!-- Picker dots will be injected here via JavaScript -->
        </div>
    </div>

    <script>
        // Data array containing 11 original palettes + 1 new (Graphite)
        // Updated for WCAG AAA Compliance (7.0:1 Contrast Ratio minimum)
        // Dark modes tweaked for stronger color identifiability based on their names.
        // Picker color added for UI representation.
        const palettes = [
            { name: "Banana",       lightBg: "#FFF59D", lightText: "#3A3300", darkBg: "#423700", darkText: "#FFFBE6", picker: "#FFB300" },
            { name: "Tangerine",    lightBg: "#FFCC80", lightText: "#4A1A00", darkBg: "#5C2800", darkText: "#FFF1E6", picker: "#FF6D00" },
            { name: "Peach",        lightBg: "#FFCCBC", lightText: "#421202", darkBg: "#662D29", darkText: "#FFEDED", picker: "#FF5252" },
            { name: "Watermelon",   lightBg: "#FFCDD2", lightText: "#470505", darkBg: "#5E121E", darkText: "#FFEDF0", picker: "#D50000" },
            { name: "Bubblegum",    lightBg: "#F8BBD0", lightText: "#36041F", darkBg: "#5C153E", darkText: "#FDE6F2", picker: "#F50057" },
            { name: "Lavender",     lightBg: "#E1BEE7", lightText: "#1F0442", darkBg: "#3D1B63", darkText: "#F2E6FC", picker: "#AA00FF" },
            { name: "Ocean",        lightBg: "#BBDEFB", lightText: "#031B40", darkBg: "#0D3057", darkText: "#E6F0FA", picker: "#2979FF" },
            { name: "Sea Glass",    lightBg: "#B2DFDB", lightText: "#00211B", darkBg: "#093D38", darkText: "#E6F9F6", picker: "#00BFA5" },
            { name: "Mint",         lightBg: "#C8E6C9", lightText: "#08290D", darkBg: "#0E421C", darkText: "#E8F7EC", picker: "#00C853" },
            { name: "Pear",         lightBg: "#F0F4C3", lightText: "#142B09", darkBg: "#38450C", darkText: "#F4FCE6", picker: "#AEEA00" },
            { name: "Pebble",       lightBg: "#F5F5F5", lightText: "#292929", darkBg: "#292929", darkText: "#F2F2F2", picker: "#9E9E9E" },
            { name: "Graphite",     lightBg: "#B0BEC5", lightText: "#10171A", darkBg: "#151E24", darkText: "#E3EAEF", picker: "#546E7A" }
        ];

        // Assigning sample text separately to keep the object clean
        palettes.forEach(p => p.sample = "Sample note text ensuring AAA contrast legibility...");

        const container = document.getElementById('matrix-container');
        const pickerRow = document.getElementById('picker-row');
        const toggle = document.getElementById('mode-toggle');
        const body = document.getElementById('body');
        const toggleContainer = document.getElementById('toggle-container');
        const lightLabel = document.getElementById('light-label');
        const darkLabel = document.getElementById('dark-label');
        const subtitle = document.getElementById('subtitle');

        function renderNotes(isDark) {
            container.innerHTML = '';
            
            palettes.forEach(palette => {
                const bg = isDark ? palette.darkBg : palette.lightBg;
                const text = isDark ? palette.darkText : palette.lightText;
                
                // Construct the HTML for an individual sticky note
                const noteEl = document.createElement('div');
                noteEl.className = 'sticky-note handlee-font rounded-lg p-6 shadow-md flex flex-col justify-between aspect-square w-full';
                noteEl.style.backgroundColor = bg;
                noteEl.style.color = text;
                
                noteEl.innerHTML = `
                    <div class="relative h-full flex flex-col">
                        <!-- Small picker dot in top right -->
                        <div class="absolute -top-2 -right-2 w-4 h-4 rounded-full shadow-sm border border-current opacity-70" style="background-color: ${palette.picker};"></div>
                        
                        <h3 class="text-xl md:text-2xl font-bold mb-3 pr-4">${palette.name}</h3>
                        <p class="text-lg md:text-xl leading-snug opacity-90 flex-grow">${palette.sample}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-current opacity-30">
                        <p class="text-sm font-medium tracking-wide flex justify-between">
                            <span>BG: ${bg}</span>
                            <span>TX: ${text}</span>
                        </p>
                    </div>
                `;
                
                container.appendChild(noteEl);
            });
        }

        function renderPickerRow() {
            pickerRow.innerHTML = '';
            palettes.forEach(palette => {
                const dot = document.createElement('div');
                // approx 20px radius = 40px width/height. Tailwind w-10 h-10 is 40px.
                dot.className = 'w-10 h-10 rounded-full cursor-pointer shadow-sm border-2 border-transparent hover:scale-110 transition-transform duration-200';
                dot.style.backgroundColor = palette.picker;
                dot.title = palette.name;
                
                // Add a subtle border specifically for the lighter Pebble color to ensure it shows up on light backgrounds
                if (palette.name === "Pebble") {
                     dot.classList.add('border-slate-300', 'dark:border-transparent');
                }

                pickerRow.appendChild(dot);
            });
        }

        function updateUI(isDark) {
            // Update Page Theme
            if (isDark) {
                body.classList.remove('bg-slate-100', 'text-slate-900');
                body.classList.add('bg-slate-900', 'text-slate-100', 'dark');
                
                // Update Toggle Container styling
                toggleContainer.classList.remove('bg-white', 'border-slate-200');
                toggleContainer.classList.add('bg-slate-800', 'border-slate-700');
                
                // Update Labels
                lightLabel.classList.remove('text-slate-800');
                lightLabel.classList.add('text-slate-500');
                darkLabel.classList.remove('text-slate-400');
                darkLabel.classList.add('text-slate-200');
                
                subtitle.classList.remove('text-slate-500');
                subtitle.classList.add('text-slate-400');

                // Animate toggle switch
                toggle.style.transform = 'translateX(100%)';
            } else {
                body.classList.add('bg-slate-100', 'text-slate-900');
                body.classList.remove('bg-slate-900', 'text-slate-100', 'dark');
                
                // Update Toggle Container styling
                toggleContainer.classList.add('bg-white', 'border-slate-200');
                toggleContainer.classList.remove('bg-slate-800', 'border-slate-700');
                
                // Update Labels
                lightLabel.classList.add('text-slate-800');
                lightLabel.classList.remove('text-slate-500');
                darkLabel.classList.add('text-slate-400');
                darkLabel.classList.remove('text-slate-200');
                
                subtitle.classList.add('text-slate-500');
                subtitle.classList.remove('text-slate-400');

                // Animate toggle switch
                toggle.style.transform = 'translateX(0)';
            }
            
            // Re-render notes with new colors
            renderNotes(isDark);
        }

        // Event Listener for the toggle switch
        toggle.addEventListener('change', (e) => {
            updateUI(e.target.checked);
        });

        // Initial Render
        renderPickerRow();
        updateUI(false);

    </script>
</body>
</html>
