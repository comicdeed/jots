#
# This is danger
#
id: io.github.comicdeed.jots.devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: io.github.comicdeed.jots.devel

tags: ['devel']
desktop-file-name-suffix: ' (Development)'

finish-args:
  - '--socket=wayland'
  - '--socket=fallback-x11'
  - '--share=ipc'
  - '--socket=session-bus'
  - '--own-name=io.github.comicdeed.jots.devel'
  - '--own-name=io.github.comicdeed.jots'
  - '--filesystem=xdg-data/io.github.elly_code.jorts:ro'
  - '--filesystem=~/.var/app/io.github.elly_code.jorts:ro'
  - '--device=dri'

modules:
  - name: libportal
    buildsystem: meson
    config-opts:
      - -Ddocs=false
      - -Dtests=false
      - -Dbackend-gtk4=enabled
      - -Dbackend-gtk3=disabled
      - -Dbackend-qt5=disabled
      - -Dvapi=true
      - -Dintrospection=true
    sources:
      - type: git
        url: https://github.com/flatpak/libportal.git
        tag: 0.7.1

  - name: jots
    buildsystem: meson
    config-opts:
      - --buildtype=debug
      - -Ddevelopment=true
      - -Dicon_variant=default
    sources:
      - type: dir
        path: .
