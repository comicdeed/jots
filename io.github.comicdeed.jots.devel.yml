#
# This is danger
#
id: io.github.comicdeed.jots.devel
# elementary SDK is not available on Flathub, so use the elementary BaseApp instead
base: io.elementary.BaseApp
base-version: 'circe-25.08'
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: io.github.comicdeed.jots.devel

tags: ['devel']
desktop-file-name-suffix: ' (Development)'

finish-args:
  - '--socket=wayland'
  - '--socket=fallback-x11'
  - '--share=ipc'
  - '--socket=session-bus'
  - '--own-name=io.github.comicdeed.jots.devel'
  - '--own-name=io.github.comicdeed.jots'
  - '--device=dri'

modules:
  - name: jots
    buildsystem: meson
    config-opts:
      - --buildtype=debug
      - -Ddevelopment=true
      - -Dicon_variant=default
    sources:
      - type: dir
        path: .
