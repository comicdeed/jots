id: io.github.comicdeed.jots
# elementary SDK is not available on Flathub, so use the elementary BaseApp instead
base: io.elementary.BaseApp
base-version: 'circe-25.08'
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: io.github.comicdeed.jots

finish-args:
  - '--socket=wayland'
  - '--socket=fallback-x11'
  - '--share=ipc'
  - '--socket=session-bus'
  - '--own-name=io.github.comicdeed.jots'
  - '--filesystem=xdg-data/io.github.elly_code.jorts:ro'
  - '--filesystem=~/.var/app/io.github.elly_code.jorts:ro'
  - '--device=dri'

cleanup:
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala

# Cleanup development-related files inherited from the BaseApp to reduce package size of your app.
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - name: jots
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dlegacy_rdnn=false
      - -Dicon_variant=default
    sources:
      - type: dir
        path: .
