[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jots-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Jots sticky notes"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Jots Contributors" }
]
dependencies = [
    "mcp>=1.3.0",
    "dbus-fast>=2.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jots-mcp = "jots_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["jots_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
