id: io.github.comicdeed.jots
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: io.github.comicdeed.jots

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=session-bus
  - --device=dri

cleanup:
  - /bin/jots-unit-tests
  - /include
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala

modules:
  - name: libportal
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Ddocs=false
      - -Dtests=false
      - -Dbackend-gtk4=enabled
      - -Dbackend-gtk3=disabled
      - -Dbackend-qt5=disabled
      - -Dvapi=true
      - -Dintrospection=true
    sources:
      - type: git
        url: https://github.com/flatpak/libportal.git
        tag: 0.7.1

  - name: jots
    buildsystem: meson
    config-opts:
      - --buildtype=debugoptimized
      - -Dicon_variant=default
    sources:
      - type: dir
        path: ../..
